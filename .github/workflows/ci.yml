name: STYL++ CI

on:
  push:
    branches: [main, feature/real-compiler]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tested commit
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          git log -1 --oneline

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm test
      - run: node bin/stylpp.js compile examples/minimal.stylpp /tmp/styles.css
      - run: node bin/stylpp.js lint examples/minimal.stylpp
